<!-- @dsCard height=288 -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Agent Zero</title>
<style>
  html, body { margin:0; padding:0; height:100%; }
  body { background:var(--color-background); color:var(--color-text); font-family:var(--font-sans); overflow:hidden; }
  .cover { position:relative; width:960px; height:288px; overflow:hidden; }
  .art { position:absolute; top:0; left:480px; width:480px; height:288px; overflow:hidden; }
  .art svg { display:block; width:480px; height:288px; }
  .bub { rx:var(--border-radius); }
  .tail { rx:var(--radius-tail); }
  .agent { fill:var(--msg-agent-bg); }
  .user { fill:var(--msg-user-bg); }
  .resp { fill:var(--msg-response-bg); }
  .code { fill:var(--msg-code-bg); }
  .send { fill:var(--send); }
  .dot { fill:var(--color-background); }
  /* light theme: messages keep one grey ground and colour their text, so the cover borrows the text hues */
  [data-theme="light"] .agent { fill:var(--msg-agent-fg); }
  [data-theme="light"] .user { fill:var(--msg-user-fg); }
  [data-theme="light"] .resp { fill:var(--msg-response-fg); }
  [data-theme="light"] .code { fill:var(--msg-code-fg); }
  .words { position:absolute; left:var(--spacing-lg); bottom:var(--spacing-lg); max-width:440px; }
  .name { margin:0; font-size:104px; line-height:.95; font-weight:600; letter-spacing:-.02em; color:var(--color-text); }
  .tag { margin:var(--spacing-sm) 0 0 4px; font-size:14px; line-height:20px; color:var(--color-text); opacity:.7; }
</style>
</head>
<body>
<div class="cover">
<div class="art" aria-hidden="true">
<svg viewBox="0 0 480 288" width="480" height="288">
<!--
  blocks      msg-agent-bg 272×72 · msg-user-bg 232×56 bleeding right · msg-response-bg 320×88 · msg-code-bg 176×96 bleeding off the top-right · send disc r40 (≈2.525rem) — ≈28% of 960×288
  arrangement a chat transcript: agent bubbles on the left, the user's bubble on the right, the send button at the foot
  pattern     a literal motif, "message colour carries meaning": each bubble squared at its speaker corner (radius-tail) and carrying a three-dot typing ellipsis cut in color-background (12 dots)
  scales      bubble corners border-radius 18px, tail corners radius-tail 5px, gaps spacing-md 20px / spacing-sm 10px, dot pitch spacing-md
-->
<rect class="code bub" x="320" y="-36" width="176" height="96" rx="18"/>
<rect class="agent bub" x="16" y="20" width="272" height="72" rx="18"/>
<rect class="agent tail" x="16" y="56" width="36" height="36" rx="5"/>
<rect class="user bub" x="264" y="112" width="232" height="56" rx="18"/>
<rect class="resp bub" x="16" y="188" width="320" height="88" rx="18"/>
<rect class="resp tail" x="16" y="240" width="36" height="36" rx="5"/>
<circle class="send" cx="408" cy="232" r="40"/>
<circle class="dot" cx="48" cy="56" r="5"/><circle class="dot" cx="68" cy="56" r="5"/><circle class="dot" cx="88" cy="56" r="5"/>
<circle class="dot" cx="296" cy="140" r="5"/><circle class="dot" cx="316" cy="140" r="5"/><circle class="dot" cx="336" cy="140" r="5"/>
<circle class="dot" cx="48" cy="232" r="5"/><circle class="dot" cx="68" cy="232" r="5"/><circle class="dot" cx="88" cy="232" r="5"/>
<circle class="dot" cx="352" cy="24" r="5"/><circle class="dot" cx="372" cy="24" r="5"/><circle class="dot" cx="392" cy="24" r="5"/>
</svg>
</div>
<div class="words">
<h1 class="name">Agent<br>Zero</h1>
<p class="tag">A dark-first chat console where every bubble's colour names its speaker.</p>
</div>
</div>
</body>
</html>
